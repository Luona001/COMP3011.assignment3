# Application name for Spring Boot
spring.application.name=Assignment1

# API key: prioritize OPENAI_API_KEY environment variable; otherwise, service reads key.txt
openai.api.key=${OPENAI_API_KEY:}

# Enable virtual threads for high concurrency (Java 21+)
# Virtual threads are lightweight and can handle >200 concurrent requests efficiently
spring.threads.virtual.enabled=true

# Increase audio upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB